<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopCart</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .card-enter {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .item-move {
            transition: all 0.3s ease;
        }
        
        .autocomplete-container {
            position: relative;
        }
        
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
        }
        
        .dark .autocomplete-list {
            background: #374151;
            border-color: #4b5563;
        }
        
        .autocomplete-item {
            padding: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .dark .autocomplete-item {
            border-bottom-color: #4b5563;
        }
        
        .autocomplete-item:hover,
        .autocomplete-item.highlighted {
            background-color: #f3f4f6;
        }
        
        .dark .autocomplete-item:hover,
        .dark .autocomplete-item.highlighted {
            background-color: #4b5563;
        }
        
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        .sync-btn-connected {
            background-color: #4ade80; /* Tailwind green-400 */
            color: #fff;
        }
        .sync-btn-connected:hover {
            background-color: #16a34a; /* Tailwind green-600 */
        }
        .dark .sync-btn-connected {
            background-color: #166534; /* Tailwind green-800 */
        }
        .dark .sync-btn-connected:hover {
            background-color: #4ade80; /* Tailwind green-400 */
        }
        .sync-btn-disconnected {
            background-color: #fb923c; /* Tailwind orange-400 */
            color: #fff;
        }
        .sync-btn-disconnected:hover {
            background-color: #ea580c; /* Tailwind orange-600 */
        }
        .dark .sync-btn-disconnected {
            background-color: #ea580c; /* Tailwind orange-600 */
        }
        .dark .sync-btn-disconnected:hover {
            background-color: #fb923c; /* Tailwind orange-400 */
        }
        /* Search box styles */
        .search-container {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .search-icon-btn {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            color: #6b7280; /* gray-500 */
            transition: color 0.2s;
        }
        .search-icon-btn:hover {
            color: #2563eb; /* blue-600 */
        }
        .search-input {
            width: 0;
            opacity: 0;
            transition: width 0.3s, opacity 0.3s;
            margin-left: 0.5rem;
            padding: 0.5rem;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            color: #111827;
            font-size: 1rem;
        }
        .dark .search-input {
            background: #374151;
            color: #f3f4f6;
            border-color: #4b5563;
        }
        .search-container.expanded .search-input {
            width: 180px;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div id="app" class="min-h-screen">
        <!-- Header -->
        <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-evenly items-center">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">LoopCart</h1>
                <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                    <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>                
                <button id="sync-gdrive-btn" class="ml-4 p-2 hidden rounded-lg transition-colors flex items-center sync-btn-disconnected" title="Sync to Google Drive">
                    <span class="material-symbols-outlined mr-1 text-white">
                        add_to_drive
                    </span>
                    <span class="font-medium text-white">Sync to Google Drive</span>
                </button>
                <button id="logout-btn" class="hidden p-2 rounded-lg bg-red-500 hover:bg-red-600 text-white transition-colors flex items-center" title="Logout">
                    <span class="material-symbols-outlined mr-1">
                        logout
                    </span>
                </button>    
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto px-4 py-6">
            <!-- Home Screen -->
            <div id="home-screen" class="block">
                <!-- Cards Grid -->
                <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-8">
                    <!-- Cards will be rendered here -->
                </div>

                <!-- Add Button -->
                <div class="mb-8">
                    <button id="add-card-btn" class="w-full max-w-md mx-auto block bg-white dark:bg-gray-800 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-8 hover:border-blue-400 dark:hover:border-blue-500 transition-colors group">
                        <div class="text-center">
                            <svg class="w-12 h-12 mx-auto text-gray-400 group-hover:text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            <p class="text-gray-600 dark:text-gray-300 group-hover:text-blue-600 dark:group-hover:text-blue-400 font-medium">Create new shopping list</p>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Card Editor -->
            <div id="card-editor" class="hidden">
                <div class="max-w-2xl mx-auto">
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700">
                        <!-- Card Header -->
                        <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-gray-700">
                            <input id="card-title" type="text" placeholder="List title..." class="flex-1 text-xl font-semibold bg-transparent border-none outline-none text-gray-800 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
                            <button id="close-card-btn" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>

                        <!-- Items List -->
                        <div class="p-4">
                            <!-- Search bar -->
                            <div class="search-container" id="items-search-container">
                                <button class="search-icon-btn" id="items-search-icon" title="Search items">
                                    <span class="material-symbols-outlined">search</span>
                                </button>
                                <input type="text" id="items-search-input" class="search-input" placeholder="Search items..." autocomplete="off">
                            </div>
                            <div id="items-list" class="space-y-2 mb-4">
                                <!-- Items will be rendered here -->
                            </div>

                            <!-- Add Item Input -->
                            <div class="autocomplete-container">
                                <div class="flex items-center space-x-2">
                                    <input id="new-item-input" type="text" placeholder="Add item..." class="flex-1 p-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-white placeholder-gray-500 dark:placeholder-gray-400" autocomplete="off">
                                    <button id="add-item-btn" class="p-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                        </svg>
                                    </button>
                                </div>
                                <div id="autocomplete-list" class="autocomplete-list hidden">
                                    <!-- Autocomplete suggestions will appear here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        class LoopCart {
            constructor() {
                this.cards = [];
                this.currentCard = null;
                this.currentCardId = null;
                this.isDark = localStorage.getItem('theme') === 'dark';
                this.autocompleteItems = [
                    // Fruits
                    'apples', 'bananas', 'oranges', 'grapes', 'strawberries', 'blueberries', 'raspberries', 'blackberries',
                    'pineapple', 'mango', 'kiwi', 'peaches', 'pears', 'plums', 'cherries', 'watermelon', 'cantaloupe',
                    'honeydew', 'lemon', 'lime', 'grapefruit', 'avocado', 'coconut', 'papaya', 'pomegranate',
                    
                    // Vegetables
                    'tomatoes', 'potatoes', 'onions', 'garlic', 'carrots', 'celery', 'broccoli', 'cauliflower',
                    'spinach', 'lettuce', 'cabbage', 'peppers', 'mushrooms', 'zucchini', 'cucumber', 'eggplant',
                    'asparagus', 'green beans', 'peas', 'corn', 'sweet potato', 'beets', 'radishes', 'kale',
                    'brussels sprouts', 'artichoke', 'leeks', 'parsnips', 'turnips',
                    
                    // Proteins
                    'chicken', 'beef', 'pork', 'fish', 'salmon', 'tuna', 'shrimp', 'eggs', 'turkey', 'ham',
                    'bacon', 'sausage', 'ground beef', 'chicken breast', 'pork chops', 'steak', 'lamb',
                    'tofu', 'tempeh', 'beans', 'lentils', 'chickpeas', 'nuts', 'almonds', 'walnuts',
                    
                    // Dairy
                    'milk', 'cheese', 'butter', 'yogurt', 'cream', 'sour cream', 'cottage cheese', 'mozzarella',
                    'cheddar', 'parmesan', 'feta', 'goat cheese', 'cream cheese', 'ice cream',
                    
                    // Grains & Bread
                    'bread', 'rice', 'pasta', 'cereal', 'oats', 'quinoa', 'flour', 'bagels', 'tortillas',
                    'crackers', 'rolls', 'baguette', 'pita', 'noodles', 'couscous', 'barley',
                    
                    // Pantry Staples
                    'salt', 'pepper', 'sugar', 'olive oil', 'vegetable oil', 'vinegar', 'baking soda', 'baking powder',
                    'vanilla', 'honey', 'maple syrup', 'ketchup', 'mustard', 'mayonnaise', 'soy sauce', 'hot sauce',
                    'barbecue sauce', 'ranch', 'italian dressing', 'salsa', 'peanut butter', 'jelly', 'jam',
                    
                    // Beverages
                    'water', 'juice', 'soda', 'coffee', 'tea', 'beer', 'wine', 'sparkling water', 'energy drinks',
                    'sports drinks', 'coconut water', 'almond milk', 'oat milk', 'soy milk',
                    
                    // Frozen Foods
                    'frozen vegetables', 'frozen fruit', 'frozen pizza', 'ice cream', 'frozen dinners', 'frozen chicken',
                    'frozen fish', 'frozen berries', 'frozen corn', 'frozen peas',
                    
                    // Snacks
                    'chips', 'pretzels', 'popcorn', 'cookies', 'crackers', 'granola bars', 'trail mix', 'chocolate',
                    'candy', 'gum', 'mints', 'dried fruit', 'jerky',
                    
                    // Household Items
                    'toilet paper', 'paper towels', 'tissues', 'laundry detergent', 'dish soap', 'shampoo', 'conditioner',
                    'toothpaste', 'deodorant', 'soap', 'lotion', 'sunscreen', 'vitamins', 'medicine',
                    'trash bags', 'aluminum foil', 'plastic wrap', 'ziplock bags', 'cleaning supplies',
                    
                    // Spices & Herbs
                    'basil', 'oregano', 'thyme', 'rosemary', 'sage', 'parsley', 'cilantro', 'dill', 'mint',
                    'cinnamon', 'paprika', 'cumin', 'chili powder', 'garlic powder', 'onion powder', 'black pepper',
                    'red pepper flakes', 'bay leaves', 'turmeric', 'ginger'
                ];
                this.selectedAutocompleteIndex = -1;
                // Search state
                this.itemsSearchTerm = '';
                this.itemsSearchExpanded = false;
                this.init();
            }

            init() {
                this.setupTheme();
                this.loadCards();
                this.bindEvents();
                this.renderHome();
            }

            setupTheme() {
                if (this.isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            loadCards() {
                const stored = localStorage.getItem('loopcart-cards');
                this.cards = stored ? JSON.parse(stored) : [];
            }

            saveCards() {
                localStorage.setItem('loopcart-cards', JSON.stringify(this.cards));
            }

            bindEvents() {
                // Theme toggle
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    this.isDark = !this.isDark;
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                    this.setupTheme();
                });

                // Add card button
                document.getElementById('add-card-btn').addEventListener('click', () => {
                    this.createNewCard();
                });

                // Close card button
                document.getElementById('close-card-btn').addEventListener('click', () => {
                    this.closeCard();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeCard();
                    }
                });

                // Add item button
                document.getElementById('add-item-btn').addEventListener('click', () => {
                    this.addItem();
                });

                // New item input
                document.getElementById('new-item-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (this.selectedAutocompleteIndex >= 0) {
                            this.selectAutocompleteItem(this.selectedAutocompleteIndex);
                        } else {
                            this.addItem();
                        }
                    }
                });

                // New item input - tab out to add item
                document.getElementById('new-item-input').addEventListener('blur', (e) => {
                    // Delay to allow autocomplete clicks to register
                    setTimeout(() => {
                        if (e.target.value.trim()) {
                            this.addItem();
                        }
                        this.hideAutocomplete();
                    }, 150);
                });

                // New item input - autocomplete
                document.getElementById('new-item-input').addEventListener('input', (e) => {
                    this.handleAutocomplete(e.target.value);
                });

                // New item input - keyboard navigation
                document.getElementById('new-item-input').addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.navigateAutocomplete(1);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.navigateAutocomplete(-1);
                    } else if (e.key === 'Escape') {
                        this.hideAutocomplete();
                    }
                });

                // Card title input
                document.getElementById('card-title').addEventListener('input', (e) => {
                    if (this.currentCard) {
                        this.currentCard.card = e.target.value;
                    }
                });

                // Search icon/button
                const searchIconBtn = document.getElementById('items-search-icon');
                const searchInput = document.getElementById('items-search-input');
                const searchContainer = document.getElementById('items-search-container');
                searchIconBtn.addEventListener('click', () => {
                    this.itemsSearchExpanded = !this.itemsSearchExpanded;
                    if (this.itemsSearchExpanded) {
                        searchContainer.classList.add('expanded');
                        searchInput.focus();
                    } else {
                        searchContainer.classList.remove('expanded');
                        this.itemsSearchTerm = '';
                        searchInput.value = '';
                        this.renderItems();
                    }
                });
                searchInput.addEventListener('input', (e) => {
                    this.itemsSearchTerm = e.target.value;
                    this.renderItems();
                });
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.itemsSearchExpanded = false;
                        searchContainer.classList.remove('expanded');
                        this.itemsSearchTerm = '';
                        searchInput.value = '';
                        this.renderItems();
                    }
                });
                searchInput.addEventListener('blur', () => {
                    this.itemsSearchExpanded = false;
                    searchContainer.classList.remove('expanded');
                    this.itemsSearchTerm = '';
                    searchInput.value = '';
                    this.renderItems();
                });
            }

            createNewCard() {
                const newCard = {
                    id: Date.now().toString(),
                    card: '',
                    items: []
                };
                
                this.currentCard = newCard;
                this.currentCardId = newCard.id;
                this.showCardEditor();
            }

            editCard(cardId) {
                const card = this.cards.find(c => c.id === cardId);
                if (card) {
                    this.currentCard = { ...card, items: [...card.items] };
                    this.currentCardId = cardId;
                    this.showCardEditor();
                }
            }

            showCardEditor() {
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('card-editor').classList.remove('hidden');
                
                // Set card title
                document.getElementById('card-title').value = this.currentCard.card;
                
                // Reset search state
                this.itemsSearchTerm = '';
                this.itemsSearchExpanded = false;
                document.getElementById('items-search-input').value = '';
                document.getElementById('items-search-container').classList.remove('expanded');
                
                // Render items
                this.renderItems();
                
                // Focus on title if empty, otherwise focus on add item input
                if (!this.currentCard.card) {
                    document.getElementById('card-title').focus();
                } else {
                    document.getElementById('new-item-input').focus();
                }
            }

            closeCard() {
                if (this.currentCard) {
                    // Save or update card
                    const existingIndex = this.cards.findIndex(c => c.id === this.currentCardId);
                    
                    if (existingIndex >= 0) {
                        this.cards[existingIndex] = this.currentCard;
                    } else {
                        this.cards.push(this.currentCard);
                    }
                    
                    this.saveCards();
                }
                
                this.currentCard = null;
                this.currentCardId = null;
                
                document.getElementById('card-editor').classList.add('hidden');
                document.getElementById('home-screen').classList.remove('hidden');
                
                this.renderHome();
            }

            addItem() {
                const input = document.getElementById('new-item-input');
                const word = input.value.trim();
                
                if (word) {
                    // Check if item already exists
                    const existingItem = this.currentCard.items.find(item => 
                        item.name.toLowerCase() === word.toLowerCase()
                    );
                    
                    if (existingItem) {
                        // If unchecked, treat as re-adding
                        if (!existingItem.checked) {
                            existingItem.last_added_time = Date.now();
                        }
                    } else {
                        // Add new item
                        this.currentCard.items.push({
                            name: word,
                            checked: false,
                            checked_count: 0,
                            last_checked_time: null,
                            last_added_time: Date.now()
                        });
                    }
                    
                    input.value = '';
                    this.renderItems();
                }  // if word
            }

            toggleItem(index) {
                const item = this.currentCard.items[index];
                item.checked = !item.checked;
                
                if (item.checked) {
                    item.checked_count++;
                    item.last_checked_time = Date.now();
                } else {
                    // Unchecking = re-adding
                    item.last_added_time = Date.now();
                }
                
                this.renderItems();
            }

            deleteItem(index) {
                this.currentCard.items.splice(index, 1);
                this.renderItems();
            }

            editItem(index, newName) {
                if (newName.trim()) {
                    this.currentCard.items[index].name = newName.trim();
                    this.renderItems();
                }
            }

            getSortedItems(card) {
                let items = card.items;
                // Filter by search term if present
                if (this.itemsSearchTerm && this.itemsSearchTerm.trim().length > 0) {
                    const term = this.itemsSearchTerm.trim().toLowerCase();
                    items = items.filter(item => item.name.toLowerCase().includes(term));
                }
                const unchecked = items.filter(item => !item.checked);
                const checked = items.filter(item => item.checked);
                
                // Sort unchecked items
                unchecked.sort((a, b) => {
                    // Most recently added first
                    return b.last_added_time - a.last_added_time;
                });
                
                // Sort checked items
                checked.sort((a, b) => {
                    // Most frequently checked first (primary)
                    if (a.checked_count !== b.checked_count) {
                        return b.checked_count - a.checked_count;
                    }
                    // Least recently checked first (secondary)
                    return a.last_checked_time - b.last_checked_time;
                });
                
                return [...unchecked, ...checked];
            }

            renderItems() {
                const container = document.getElementById('items-list');
                const sortedItems = this.getSortedItems(this.currentCard);
                
                container.innerHTML = '';
                
                sortedItems.forEach((item, index) => {
                    const originalIndex = this.currentCard.items.indexOf(item);
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `flex items-center space-x-3 p-3 bg-gray-50 dark:bg-gray-700 rounded-lg item-move ${item.checked ? 'opacity-60' : ''}`;
                    
                    itemDiv.innerHTML = `
                        <input type="checkbox" ${item.checked ? 'checked' : ''} 
                               class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500"
                               onchange="app.toggleItem(${originalIndex})">
                        <input type="text" value="${item.name}" 
                               class="flex-1 bg-transparent border-none outline-none text-gray-800 dark:text-white ${item.checked ? 'line-through' : ''}"
                               oninput="app.handleAutocomplete(this.value)"
                               onblur="app.editItem(${originalIndex}, this.value)"
                               onkeypress="if(event.key==='Enter') this.blur()">
                        <button onclick="app.deleteItem(${originalIndex})" 
                                class="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded transition-colors">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    `;
                    
                    container.appendChild(itemDiv);
                });
            }

            renderHome() {
                const container = document.getElementById('cards-container');
                container.innerHTML = '';
                
                this.cards.forEach(card => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 p-4 hover:shadow-lg transition-shadow cursor-pointer card-enter relative';
                    
                    const title = card.card || 'Untitled List';
                    const itemCount = card.items.length;
                    const checkedCount = card.items.filter(item => item.checked).length;
                    
                    cardDiv.innerHTML = `
                        <button class="absolute top-2 right-2 p-1 rounded hover:bg-red-100 dark:hover:bg-red-300 transition-colors delete-card-btn" title="Delete card">
                            <span class="material-symbols-outlined text-red-500">delete</span>
                        </button>
                        <h3 class="font-semibold text-gray-800 dark:text-white mb-2 truncate">${title}</h3>
                        <p class="text-gray-600 dark:text-gray-300 text-sm mb-3">${itemCount} items, ${checkedCount} completed</p>
                        <div class="space-y-1">
                            ${this.getSortedItems(card).slice(0, 3).map(item => `
                                <div class="flex items-center space-x-2 text-sm">
                                    <div class="w-3 h-3 border border-gray-300 rounded ${item.checked ? 'bg-green-500 border-green-500' : ''}"></div>
                                    <span class="text-gray-700 dark:text-gray-300 truncate ${item.checked ? 'line-through opacity-60' : ''}">${item.name}</span>
                                </div>
                            `).join('')}
                            ${card.items.length > 3 ? `<p class="text-xs text-gray-500 dark:text-gray-400">+${card.items.length - 3} more items</p>` : ''}
                        </div>
                    `;
                    
                    // Prevent card edit when clicking delete
                    cardDiv.addEventListener('click', (e) => {
                        if (e.target.closest('.delete-card-btn')) return;
                        this.editCard(card.id);
                    });
                    // Delete card button
                    cardDiv.querySelector('.delete-card-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm('Are you sure you want to delete this card? This action cannot be undone.')) {
                            this.deleteCard(card.id);
                        }
                    });
                    
                    container.appendChild(cardDiv);
                });
            }

            deleteCard(cardId) {
                this.cards = this.cards.filter(c => c.id !== cardId);
                this.saveCards();
                this.renderHome();
            }

            // Autocomplete functions
            handleAutocomplete(input) {
                const trimmedInput = input.trim().toLowerCase();
                
                if (trimmedInput.length === 0) {
                    this.hideAutocomplete();
                    return;
                }

                // Get the last word being typed
                const words = trimmedInput.split(/\s+/);
                const lastWord = words[words.length - 1];
                
                if (lastWord.length < 2) {
                    this.hideAutocomplete();
                    return;
                }

                // Filter autocomplete items
                const matches = this.autocompleteItems.filter(item => 
                    item.toLowerCase().startsWith(lastWord)
                ).slice(0, 8); // Limit to 8 suggestions

                if (matches.length > 0) {
                    this.showAutocomplete(matches, lastWord);
                } else {
                    this.hideAutocomplete();
                }
            }

            showAutocomplete(matches, searchTerm) {
                const list = document.getElementById('autocomplete-list');
                list.innerHTML = '';
                
                matches.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item text-gray-800 dark:text-white';
                    div.textContent = item;
                    div.addEventListener('click', () => {
                        this.selectAutocompleteFromClick(item, searchTerm);
                    });
                    list.appendChild(div);
                });
                
                list.classList.remove('hidden');
                this.selectedAutocompleteIndex = -1;
            }

            hideAutocomplete() {
                const list = document.getElementById('autocomplete-list');
                list.classList.add('hidden');
                this.selectedAutocompleteIndex = -1;
            }

            navigateAutocomplete(direction) {
                const list = document.getElementById('autocomplete-list');
                const items = list.querySelectorAll('.autocomplete-item');
                
                if (items.length === 0) return;

                // Remove previous highlight
                if (this.selectedAutocompleteIndex >= 0) {
                    items[this.selectedAutocompleteIndex].classList.remove('highlighted');
                }

                // Update index
                this.selectedAutocompleteIndex += direction;
                
                if (this.selectedAutocompleteIndex < 0) {
                    this.selectedAutocompleteIndex = items.length - 1;
                } else if (this.selectedAutocompleteIndex >= items.length) {
                    this.selectedAutocompleteIndex = 0;
                }

                // Add new highlight
                items[this.selectedAutocompleteIndex].classList.add('highlighted');
                
                // Scroll into view
                items[this.selectedAutocompleteIndex].scrollIntoView({
                    block: 'nearest'
                });
            }

            selectAutocompleteItem(index) {
                const list = document.getElementById('autocomplete-list');
                const items = list.querySelectorAll('.autocomplete-item');
                
                if (index >= 0 && index < items.length) {
                    const selectedItem = items[index].textContent;
                    const input = document.getElementById('new-item-input');
                    const currentValue = input.value.trim();
                    const words = currentValue.split(/\s+/);
                    
                    // Replace the last word with the selected item
                    words[words.length - 1] = selectedItem;
                    input.value = words.join(' ');
                    
                    this.hideAutocomplete();
                    input.focus();
                }
            }

            selectAutocompleteFromClick(selectedItem, searchTerm) {
                const input = document.getElementById('new-item-input');
                const currentValue = input.value.trim();
                const words = currentValue.split(/\s+/);
                
                // Replace the last word with the selected item
                words[words.length - 1] = selectedItem;
                input.value = words.join(' ');
                
                this.hideAutocomplete();
                input.focus();
            }
        }

        // Initialize app
        const app = new LoopCart();

        // --- Google API Config ---
        const GOOGLE_CLIENT_ID = '241832316729-il4a6ntr95kduo99tqjmjaknreabton8.apps.googleusercontent.com'; // TODO: Replace with your actual client ID
        const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
        let googleAuthInstance = null;
        let googleUser = null;
        let loopCartSpreadsheetId = null;

        // Find or create the LoopCart spreadsheet
        async function getOrCreateLoopCartSpreadsheet() {
            // Check localStorage first
            loopCartSpreadsheetId = localStorage.getItem('loopcart-spreadsheet-id');
            if (loopCartSpreadsheetId) return loopCartSpreadsheetId;
            // Search for spreadsheet named 'LoopCart'
            const query = "name = 'LoopCart' and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false";
            const resp = await gapi.client.drive.files.list({
                q: query,
                fields: 'files(id, name)',
                spaces: 'drive'
            });
            if (resp.result.files && resp.result.files.length > 0) {
                loopCartSpreadsheetId = resp.result.files[0].id;
                localStorage.setItem('loopcart-spreadsheet-id', loopCartSpreadsheetId);
                return loopCartSpreadsheetId;
            }
            // Not found, create it
            const createResp = await gapi.client.sheets.spreadsheets.create({
                properties: { title: 'LoopCart' }
            });
            loopCartSpreadsheetId = createResp.result.spreadsheetId;
            localStorage.setItem('loopcart-spreadsheet-id', loopCartSpreadsheetId);
            return loopCartSpreadsheetId;
        }

        // Write all cards data as JSON to cell A1
        async function syncAllCardsToSheet(cards) {
            if (!googleAuthInstance || !googleAuthInstance.isSignedIn.get()) {
                alert('Please sign in to Google first.');
                return;
            }
            if (!cards || !Array.isArray(cards) || cards.length === 0) {
                alert('No cards to sync.');
                return;
            }
            try {
                const spreadsheetId = await getOrCreateLoopCartSpreadsheet();
                const jsonData = JSON.stringify(cards, null, 2);
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId,
                    range: 'Sheet1!A1',
                    valueInputOption: 'RAW',
                    resource: { values: [[jsonData]] }
                });
                showSyncStatus('All cards synced to Google Drive!', true);
            } catch (err) {
                console.error('Stack trace:', err.stack); // Logs the full stack trace
                showSyncStatus('Sync failed: ' + (err.result?.error?.message || err.message), false);
            }
        }

        // Show sync status message
        function showSyncStatus(message, success) {
            let statusDiv = document.getElementById('sync-status-msg');
            if (!statusDiv) {
                statusDiv = document.createElement('div');
                statusDiv.id = 'sync-status-msg';
                statusDiv.className = 'fixed top-20 right-4 z-50 px-4 py-2 rounded shadow-lg text-white';
                document.body.appendChild(statusDiv);
            }
            statusDiv.textContent = message;
            statusDiv.style.backgroundColor = success ? '#16a34a' : '#dc2626';
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 2500);
        }

        // --- Patch LoopCart to sync all cards on card close ---
        const originalCloseCard = LoopCart.prototype.closeCard;
        LoopCart.prototype.closeCard = function() {
            originalCloseCard.apply(this, arguments);
            // Sync all cards after closing card (if signed in)
            if (googleAuthInstance && googleAuthInstance.isSignedIn.get() && this.cards.length > 0) {
                syncAllCardsToSheet(this.cards);
            }
        };

        // --- Patch Google sign-in to sync all cards ---
        async function handleGoogleSignIn() {
            if (!googleAuthInstance) {
                alert('Google API not initialized yet.');
                return;
            }
            try {
                await googleAuthInstance.signIn();
                googleUser = googleAuthInstance.currentUser.get();
                updateSyncButton();
                // Sync all cards if any exist
                if (app.cards && app.cards.length > 0) {
                    syncAllCardsToSheet(app.cards);
                }
                showSyncStatus('Signed in to Google Drive!', true);
            } catch (err) {
                console.error('Stack trace:', err); // Logs the full stack trace
                showSyncStatus('Google sign-in failed.', false);
            }
        }

        async function handleGoogleSignOut() {
            if (!googleAuthInstance) {
                alert('Google API not initialized yet.');
                return;
            }
            try {
                await googleAuthInstance.signOut();
                googleUser = null;
                updateSyncButton();
                showSyncStatus('Disconnected from Google Drive!', true);
            } catch (err) {
                showSyncStatus('Sign-out failed.', false);
            }
        }

        // Load and initialize Google API client
        function initGoogleAPI() {
            gapi.load('client:auth2', async () => {
                await gapi.client.init({
                    clientId: GOOGLE_CLIENT_ID,
                    scope: GOOGLE_SCOPES,
                    discoveryDocs: [
                    "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest",
                    "https://sheets.googleapis.com/$discovery/rest?version=v4"
                  ]
                });
                googleAuthInstance = gapi.auth2.getAuthInstance();
                updateSyncButton();
            });

            // Initial button state.
            // updateSyncButton();
        }

        // Update Sync button text based on sign-in state
        function updateSyncButton() {
            const btn = document.getElementById('sync-gdrive-btn');
            if (!btn) return;

            btn.classList.remove("hidden");

            const labelSpan = btn.querySelectorAll('span')[1]; // Second span holds the text
            const iconSpan = btn.querySelector('span.material-symbols-outlined');

            if (googleAuthInstance && googleAuthInstance.isSignedIn.get()) {
                labelSpan.textContent = 'Connected';
                btn.classList.add('sync-btn-connected');
                btn.classList.remove('sync-btn-disconnected');
                document.getElementById('logout-btn').classList.remove("hidden");
            } else {
                labelSpan.textContent = 'Sync to Google Drive';
                btn.classList.add('sync-btn-disconnected');
                btn.classList.remove('sync-btn-connected');
                document.getElementById('logout-btn').classList.add("hidden");
            }
            // Always ensure icon and label are white
            if (iconSpan) iconSpan.classList.add('text-white');
            labelSpan.classList.add('text-white');
        }

        // Bind Sync button event after DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            const syncBtn = document.getElementById('sync-gdrive-btn');
            if (syncBtn) {
                syncBtn.addEventListener('click', handleGoogleSignIn);
            }

            const signOutBtn = document.getElementById('logout-btn');
            if (signOutBtn) {
                signOutBtn.addEventListener('click', handleGoogleSignOut);
            }

            // Initialize Google API
            if (window.gapi) {
                initGoogleAPI();
            } else {
                // Wait for gapi to load if not ready
                const gapiInterval = setInterval(() => {
                    if (window.gapi) {
                        clearInterval(gapiInterval);
                        initGoogleAPI();
                    }
                }, 100);
            }
        });
    </script>
