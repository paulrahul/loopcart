<!DOCTYPE html>

    <style>
        .card-enter {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .item-move {
            transition: all 0.3s ease;
        }
        
        .autocomplete-container {
            position: relative;
        }
        
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
        }
        
        .dark .autocomplete-list {
            background: #374151;
            border-color: #4b5563;
        }
        
        .autocomplete-item {
            padding: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .dark .autocomplete-item {
            border-bottom-color: #4b5563;
        }
        
        .autocomplete-item:hover,
        .autocomplete-item.highlighted {
            background-color: #f3f4f6;
        }
        
        .dark .autocomplete-item:hover,
        .dark .autocomplete-item.highlighted {
            background-color: #4b5563;
        }
        
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        .sync-btn-connected {
            background-color: #4ade80; /* Tailwind green-400 */
            color: #fff;
        }
        .sync-btn-connected:hover {
            background-color: #16a34a; /* Tailwind green-600 */
        }
        .dark .sync-btn-connected {
            background-color: #166534; /* Tailwind green-800 */
        }
        .dark .sync-btn-connected:hover {
            background-color: #4ade80; /* Tailwind green-400 */
        }
        .sync-btn-disconnected {
            background-color: #fb923c; /* Tailwind orange-400 */
            color: #fff;
        }
        .sync-btn-disconnected:hover {
            background-color: #ea580c; /* Tailwind orange-600 */
        }
        .dark .sync-btn-disconnected {
            background-color: #ea580c; /* Tailwind orange-600 */
        }
        .dark .sync-btn-disconnected:hover {
            background-color: #fb923c; /* Tailwind orange-400 */
        }
        /* Search box styles */
        .search-container {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .search-icon-btn {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            color: #6b7280; /* gray-500 */
            transition: color 0.2s;
        }
        .search-icon-btn:hover {
            color: #2563eb; /* blue-600 */
        }
        .search-input {
            width: 0;
            opacity: 0;
            transition: width 0.3s, opacity 0.3s;
            margin-left: 0.5rem;
            padding: 0.5rem;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            color: #111827;
            font-size: 1rem;
        }
        .dark .search-input {
            background: #374151;
            color: #f3f4f6;
            border-color: #4b5563;
        }
        .search-container.expanded .search-input {
            width: 180px;
            opacity: 1;
        }
    </style>

            async init() {

            setupTheme() {
                if (this.isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            mergeItems(cloudItems, localItems) {
                let resultItems = [];

                for (const localItem of localItems) {
                    const exists = cloudItems.some(c => c.name === localItem.name);
                    if (!exists) {
                        resultItems.push(localItem);
                    } else {
                        // Same item exists in both cloud and local card. Take
                        // the state of the one which is more latest.
                        const cloudItem = cloudItems.find(i => i.name === localItem.name);
                        const cloudItemLastMod = cloudItem.last_checked_time > cloudItem.last_added_time ? 
                            cloudItem.last_checked_time : cloudItem.last_added_time;

                        const localItemLastMod = localItem.last_checked_time > localItem.last_added_time ? 
                            localItem.last_checked_time : localItem.last_added_time;

                        if (localItemLastMod > cloudItemLastMod) {
                            resultItems.push(localItem);
                        } else {
                            resultItems.push(cloudItem);
                        }
                    }
                }

                return resultItems;
            }

            mergeCards(cloudCards, localCards) {
                let resultCards = [];

                for (const localCard of localCards) {
                    const exists = cloudCards.some(c => c.card === localCard.card && c.id === localCard.id);
                    if (!exists) {
                        resultCards.push(localCard);
                    } else {
                        const cloudCard = cloudCards.find(c => c.card === localCard.card && c.id === localCard.id);
                        // Add the more latest one.
                        let newCard = {
                            id: localCard.id,
                            card: localCard.card,
                            items: this.mergeItems(cloudCard.items, localCard.items),
                            sorting: cloudCard.sorting !== undefined ? cloudCard.sorting : (localCard.sorting !== undefined ? localCard.sorting : 0)
                        };

                        resultCards.push(newCard);
                    }
                }

                for (const cloudCard of cloudCards) {
                    const exists = localCards.some(c => c.card === cloudCard.card);
                    if (!exists) {
                        resultCards.push(cloudCard);
                    }
                    // if same, then it would have already been resolved and
                    // merged in the previous for loop.
                }

                return resultCards;
            }

            async loadCards() {
                let cloudCards = [];

                // Only try Google Sheets if signed in and spreadsheet is available
                if (googleAuthInstance && googleAuthInstance.isSignedIn.get()) {
                    let spreadsheetId = localStorage.getItem('loopcart-spreadsheet-id');
                    // If not in localStorage, search Drive (but do NOT create)
                    if (!spreadsheetId) {
                        try {
                            const query = `name = '${SPREADSHEET_NAME}' and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false`;
                            const resp = await gapi.client.drive.files.list({
                                q: query,
                                fields: 'files(id, name)',
                                spaces: 'drive'
                            });
                            if (resp.result.files && resp.result.files.length > 0) {
                                spreadsheetId = resp.result.files[0].id;
                                localStorage.setItem('loopcart-spreadsheet-id', spreadsheetId);
                            }
                        } catch (err) {
                            // Ignore Drive search errors, fallback to local
                        }
                    }
                    if (spreadsheetId) {
                        try {
                            const resp = await gapi.client.sheets.spreadsheets.values.get({
                                spreadsheetId,
                                range: 'Sheet1!A1',
                            });
                            const values = resp.result.values;
                            if (values && values.length > 0 && values[0][0]) {
                                const json = values[0][0];
                                try {
                                    const cards = JSON.parse(json);
                                    if (Array.isArray(cards)) {
                                        cloudCards = cards;
                                        // this.cards = cards;
                                        // showSyncStatus('Loaded from Google Drive!', true);
                                        showSyncStatus('Syncing with Google Drive!', true);
                                        // return;
                                    }
                                } catch (e) {
                                    console.error('Error stack: ' + e.stack);
                                    showSyncStatus('Google data corrupted, loading local.', false);
                                }
                            } else {
                                showSyncStatus('No data in Google Sheet, loading local.', false);
                            }
                        } catch (err) {
                            showSyncStatus('Failed to load from Google: ' + (err.result?.error?.message || err.message), false);
                        }
                    }
                }

                // Fallback to localStorage
                const stored = localStorage.getItem('loopcart-cards');
                const localCards = stored ? JSON.parse(stored) : [];

                this.cards = this.mergeCards(cloudCards, localCards);
            }

            saveCards() {
                localStorage.setItem('loopcart-cards', JSON.stringify(this.cards));
            }

            bindEvents() {
                // Theme toggle
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    this.isDark = !this.isDark;
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                    this.setupTheme();
                });

                // Add card button
                document.getElementById('add-card-btn').addEventListener('click', () => {
                    this.createNewCard();
                });

                // Close card button
                document.getElementById('close-card-btn').addEventListener('click', () => {
                    this.closeCard();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeCard();
                    }
                });

                // Add item button
                document.getElementById('add-item-btn').addEventListener('click', () => {
                    this.addItem();
                });

                // New item input
                document.getElementById('new-item-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (this.selectedAutocompleteIndex >= 0) {
                            this.selectAutocompleteItem(this.selectedAutocompleteIndex);
                        } else {
                            this.addItem();
                        }
                    }
                });

                // New item input - tab out to add item
                document.getElementById('new-item-input').addEventListener('blur', (e) => {
                    // Delay to allow autocomplete clicks to register
                    setTimeout(() => {
                        if (e.target.value.trim()) {
                            this.addItem();
                        }
                        this.hideAutocomplete();
                    }, 150);
                });

                // New item input - autocomplete
                document.getElementById('new-item-input').addEventListener('input', (e) => {
                    this.handleAutocomplete(e.target.value);
                });

                // New item input - keyboard navigation
                document.getElementById('new-item-input').addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.navigateAutocomplete(1);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.navigateAutocomplete(-1);
                    } else if (e.key === 'Escape') {
                        this.hideAutocomplete();
                    }
                });

                // Card title input

            addItem() {
                const input = document.getElementById('new-item-input');
                const word = input.value.trim();
                
                if (word) {
                    // Check if item already exists
                    const existingItem = this.currentCard.items.find(item => 
                        item.name.toLowerCase() === word.toLowerCase()
                    );
                    
                    if (existingItem) {
                        // If unchecked, treat as re-adding
                        if (!existingItem.checked) {
                            existingItem.last_added_time = Date.now();
                        }
                    } else {
                        // Add new item
                        this.currentCard.items.push({
                            name: word,
                            checked: false,
                            checked_count: 0,
                            last_checked_time: null,
                            last_added_time: Date.now()
                        });
                    }
                    
                    input.value = '';
                    this.renderItems();
                }  // if word
            }

            toggleItem(index) {
                const item = this.currentCard.items[index];
                item.checked = !item.checked;
                
                if (item.checked) {
                    item.checked_count++;
                    item.last_checked_time = Date.now();
                } else {
                    // Unchecking = re-adding
                    item.last_added_time = Date.now();
                }
                
                this.renderItems();
            }

            deleteItem(index) {
                this.currentCard.items.splice(index, 1);
                this.renderItems();
            }

            editItem(index, newName) {
                if (newName.trim()) {
                    this.currentCard.items[index].name = newName.trim();
                    this.renderItems();
                }
            }

            getSortedItems(card) {
                let items = card.items;
                // Filter by search term if present
                if (this.itemsSearchTerm && this.itemsSearchTerm.trim().length > 0) {
                    const term = this.itemsSearchTerm.trim().toLowerCase();
                    items = items.filter(item => item.name.toLowerCase().includes(term));
                }
                const sorting = card.sorting !== undefined ? card.sorting : 0;
                if (sorting === 1) { // Loopy (current logic)
                    const unchecked = items.filter(item => !item.checked);
                    const checked = items.filter(item => item.checked);
                    unchecked.sort((a, b) => b.last_added_time - a.last_added_time);
                    checked.sort((a, b) => {
                        if (a.checked_count !== b.checked_count) {
                            return b.checked_count - a.checked_count;
                        }
                        return a.last_checked_time - b.last_checked_time;
                    });
                    return [...unchecked, ...checked];
                } else if (sorting === 2) { // Todo
                    // Only unchecked, earliest added first
                    return items.filter(item => !item.checked).sort((a, b) => a.last_added_time - b.last_added_time);
                } else { // Default
                    // All items as added (by last_added_time ascending)
                    return [...items].sort((a, b) => a.last_added_time - b.last_added_time);
                }
            }

            deleteCard(cardId) {

            // Autocomplete functions
            handleAutocomplete(input) {
                const trimmedInput = input.trim().toLowerCase();
                
                if (trimmedInput.length === 0) {
                    this.hideAutocomplete();
                    return;
                }

                // Get the last word being typed
                const words = trimmedInput.split(/\s+/);
                const lastWord = words[words.length - 1];
                
                if (lastWord.length < 2) {
                    this.hideAutocomplete();
                    return;
                }

                // Filter autocomplete items
                const matches = this.autocompleteItems.filter(item => 
                    item.toLowerCase().startsWith(lastWord)
                ).slice(0, 8); // Limit to 8 suggestions

                if (matches.length > 0) {
                    this.showAutocomplete(matches, lastWord);
                } else {
                    this.hideAutocomplete();
                }
            }

            showAutocomplete(matches, searchTerm) {
                const list = document.getElementById('autocomplete-list');
                list.innerHTML = '';
                
                matches.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item text-gray-800 dark:text-white';
                    div.textContent = item;
                    div.addEventListener('click', () => {
                        this.selectAutocompleteFromClick(item, searchTerm);
                    });
                    list.appendChild(div);
                });
                
                list.classList.remove('hidden');
                this.selectedAutocompleteIndex = -1;
            }

            hideAutocomplete() {
                const list = document.getElementById('autocomplete-list');
                list.classList.add('hidden');
                this.selectedAutocompleteIndex = -1;
            }

            navigateAutocomplete(direction) {
                const list = document.getElementById('autocomplete-list');
                const items = list.querySelectorAll('.autocomplete-item');
                
                if (items.length === 0) return;

                // Remove previous highlight
                if (this.selectedAutocompleteIndex >= 0) {
                    items[this.selectedAutocompleteIndex].classList.remove('highlighted');
                }

                // Update index
                this.selectedAutocompleteIndex += direction;
                
                if (this.selectedAutocompleteIndex < 0) {
                    this.selectedAutocompleteIndex = items.length - 1;
                } else if (this.selectedAutocompleteIndex >= items.length) {
                    this.selectedAutocompleteIndex = 0;
                }

                // Add new highlight
                items[this.selectedAutocompleteIndex].classList.add('highlighted');
                
                // Scroll into view
                items[this.selectedAutocompleteIndex].scrollIntoView({
                    block: 'nearest'
                });
            }

            selectAutocompleteItem(index) {
                const list = document.getElementById('autocomplete-list');
                const items = list.querySelectorAll('.autocomplete-item');
                
                if (index >= 0 && index < items.length) {
                    const selectedItem = items[index].textContent;
                    const input = document.getElementById('new-item-input');
                    const currentValue = input.value.trim();
                    const words = currentValue.split(/\s+/);
                    
                    // Replace the last word with the selected item
                    words[words.length - 1] = selectedItem;
                    input.value = words.join(' ');
                    
                    this.hideAutocomplete();
                    input.focus();
                }
            }

            selectAutocompleteFromClick(selectedItem, searchTerm) {
                const input = document.getElementById('new-item-input');
                const currentValue = input.value.trim();
                const words = currentValue.split(/\s+/);
                
                // Replace the last word with the selected item
                words[words.length - 1] = selectedItem;
                input.value = words.join(' ');
                
                this.hideAutocomplete();
                input.focus();
            }

        // Initialize app
        const app = new LoopCart();

        // --- Google API Config ---
        // Set spreadsheet name based on environment
        const SPREADSHEET_NAME = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'LoopCart-testing' : 'LoopCart';
        const GOOGLE_CLIENT_ID = '241832316729-il4a6ntr95kduo99tqjmjaknreabton8.apps.googleusercontent.com'; // TODO: Replace with your actual client ID
        const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
        let googleAuthInstance = null;
        let googleUser = null;
        let loopCartSpreadsheetId = null;

        // Find or create the LoopCart spreadsheet
        async function getOrCreateLoopCartSpreadsheet() {
            // Check localStorage first
            loopCartSpreadsheetId = localStorage.getItem('loopcart-spreadsheet-id');
            if (loopCartSpreadsheetId) return loopCartSpreadsheetId;
            // Search for spreadsheet named SPREADSHEET_NAME
            const query = `name = '${SPREADSHEET_NAME}' and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false`;
            const resp = await gapi.client.drive.files.list({
                q: query,
                fields: 'files(id, name)',
                spaces: 'drive'
            });
            if (resp.result.files && resp.result.files.length > 0) {
                loopCartSpreadsheetId = resp.result.files[0].id;
                localStorage.setItem('loopcart-spreadsheet-id', loopCartSpreadsheetId);
                return loopCartSpreadsheetId;
            }
            // Not found, create it
            const createResp = await gapi.client.sheets.spreadsheets.create({
                properties: { title: SPREADSHEET_NAME }
            });
            loopCartSpreadsheetId = createResp.result.spreadsheetId;
            localStorage.setItem('loopcart-spreadsheet-id', loopCartSpreadsheetId);
            return loopCartSpreadsheetId;
        }

        // Write all cards data as JSON to cell A1
        async function syncAllCardsToSheet(cards) {
            if (!googleAuthInstance || !googleAuthInstance.isSignedIn.get()) {
                alert('Please sign in to Google first.');
                return;
            }
            if (!cards || !Array.isArray(cards) || cards.length === 0) {
                alert('No cards to sync.');
                return;
            }
            try {
                const spreadsheetId = await getOrCreateLoopCartSpreadsheet();
                const jsonData = JSON.stringify(cards, null, 2);
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId,
                    range: 'Sheet1!A1',
                    valueInputOption: 'RAW',
                    resource: { values: [[jsonData]] }
                });
                showSyncStatus('Synced to Google Drive!', true);
            } catch (err) {
                console.error('Stack trace:', err.stack); // Logs the full stack trace
                showSyncStatus('Sync failed: ' + (err.result?.error?.message || err.message), false);
            }
        }

        // Show sync status message
        function showSyncStatus(message, success) {

                statusDiv = document.createElement('div');
                statusDiv.id = 'sync-status-msg';
                statusDiv.className = 'fixed top-20 right-4 z-50 px-4 py-2 rounded shadow-lg text-white';
                document.body.appendChild(statusDiv);
            }
            statusDiv.textContent = message;
            statusDiv.style.backgroundColor = success ? '#16a34a' : '#dc2626';
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 2500);
        }

        const originalCloseCard = LoopCart.prototype.closeCard;

            if (googleAuthInstance && googleAuthInstance.isSignedIn.get() && this.cards.length > 0 && this.currentCard) {

        // Update Sync button text based on sign-in state
        function updateSyncButton() {
            const btn = document.getElementById('sync-gdrive-btn');
            if (!btn) return;

            btn.classList.remove("hidden");

            const labelSpan = btn.querySelectorAll('span')[1]; // Second span holds the text
            const iconSpan = btn.querySelector('span.material-symbols-outlined');

            if (googleAuthInstance && googleAuthInstance.isSignedIn.get()) {
                labelSpan.textContent = 'Connected';
                btn.classList.add('sync-btn-connected');
                btn.classList.remove('sync-btn-disconnected');
                document.getElementById('logout-btn').classList.remove("hidden");
            } else {
                labelSpan.textContent = 'Sync to Google Drive';
                btn.classList.add('sync-btn-disconnected');
                btn.classList.remove('sync-btn-connected');
                document.getElementById('logout-btn').classList.add("hidden");
            }
            // Always ensure icon and label are white
            if (iconSpan) iconSpan.classList.add('text-white');
            labelSpan.classList.add('text-white');
        }

        function createTestData() {
            //const stored = localStorage.getItem('loopcart-cards');
            //const localCards = stored ? JSON.parse(stored) : [];

            let localCards = app.cards;
            
            // Create Test card if not already there.
            let testCard = localCards.find(c => c.card === "TestData");
            if (!testCard) {
                testCard = {
                    id: Date.now().toString(),
                    card: "TestData",
                    items: [],
                    sorting: 0 // Default sorting
                };
                localCards.push(testCard);
            }

            // Remove "new_" prefix from all existing items.
            /*testCard.items.forEach(item => {
                if (item.name.startsWith("new_")) {
                  item.name = item.name.replace(/^new_/, '');
                }
            });*/

            // Randomly check an existing item or create a checked one.
            let checkItem = testCard.items.find(i => i.checked === false);
            if (!checkItem) {
                checkItem = {
                    name: app.autocompleteItems[Math.floor(Math.random() * app.autocompleteItems.length)],
                    checked: false,
                    checked_count: 0,
                    last_checked_time: null,
                    last_added_time: Date.now()
                };
                testCard.items.push(checkItem);
            }
            //checkItem.name = "new_" + checkItem.name;
            checkItem.checked = true;
            checkItem.checked_count++;
            checkItem.last_checked_time = Date.now();

            // Randomly uncheck an existing item or create a checked one.
            let uncheckItem = testCard.items.find(i => i.checked === true && i.name != checkItem.name);
            if (!uncheckItem) {
                uncheckItem = {
                    name: app.autocompleteItems[Math.floor(Math.random() * app.autocompleteItems.length)],
                    checked: false,
                    checked_count: 0,
                    last_checked_time: null,
                    last_added_time: Date.now()
                };
                testCard.items.push(uncheckItem);
            }
            //uncheckItem.name = "new_" + uncheckItem.name;
            uncheckItem.checked = false;
            uncheckItem.last_added_time = Date.now();
            
            // Add a new checkbox
            const newItem = {
                name: /*"new_" +*/ app.autocompleteItems[Math.floor(Math.random() * app.autocompleteItems.length)],
                checked: false,
                checked_count: 0,
                last_checked_time: null,
                last_added_time: Date.now()
            };
            testCard.items.push(newItem);

            // Finally, write the contents in local JSON.
            localStorage.setItem('loopcart-cards', JSON.stringify(localCards));
            app.renderHome();
        }

        // Bind Sync button event after DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                const testBtn = document.getElementById('test-data-btn'); 
                if (testBtn) {
                    testBtn.classList.remove("hidden");
                    testBtn.addEventListener('click', createTestData);
                }
            }

            const syncBtn = document.getElementById('sync-gdrive-btn');
            if (syncBtn) {
                syncBtn.addEventListener('click', handleGoogleSignIn);
            }

            const signOutBtn = document.getElementById('logout-btn');
            if (signOutBtn) {
                signOutBtn.addEventListener('click', handleGoogleSignOut);
            }

            // Initialize Google API
            if (window.gapi) {
                initGoogleAPI();
            } else {
                // Wait for gapi to load if not ready
                const gapiInterval = setInterval(() => {
                    if (window.gapi) {
                        clearInterval(gapiInterval);
                        initGoogleAPI();
                    }
                }, 100);
            }
        });
    </script>
</body>
